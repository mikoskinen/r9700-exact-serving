# ds41-117-tp4.yaml (6.11.2026) -- the 1.17 EXL3 queue items 45/46/47: = ds41-pr266-tp4.yaml (MODELDIR mount, the serve line in
# ARGS, project/container radiance-ds41-exl3) plus the profiling environment. Unset variables pass as empty, which the engine
# reads as off (RADIANCE_PROFILE_EVERY empty -> its default 32; RADIANCE_PROFILE_SYNC is read only by the -profsync image).
# RADIANCE_AQL_STAMP=N stamps every dispatch of one recorded pass in N on card 0 into /stats/stamps.csv (STATSDIR on the host).
name: radiance-ds41-exl3
services:
  radiance:
    extends: { file: /home/mikoskinen/radiance-1.15.1/compose/common.yaml, service: radiance }
    image: ${IMAGE:?set IMAGE}
    container_name: radiance-ds41-exl3
    restart: "no"
    volumes:
      - ${MODELDIR:?set MODELDIR}:/models:ro
      - ${STATSDIR:?set STATSDIR}:/stats
    environment:
      RADIANCE_PROFILE_EVERY: ${PROFEVERY:-}
      RADIANCE_PROFILE_SYNC: ${PROFSYNC:-}
      RADIANCE_AQL_STAMP: ${AQLSTAMP:-}
      RADIANCE_AQL_STAMP_OUT: /stats/stamps.csv
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
    command: >
      --model /models/${MODEL:?set MODEL} --served-model-name deepseek-v4.1-flash --host 127.0.0.1 --port 8090
      ${ARGS:?set ARGS}
