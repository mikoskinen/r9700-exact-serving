# 30-tune512.cfg (6.11.2026) -- one change per row from bakon's TP4 line (20-bakon.sh; its host pool from runs/pr266/base.env)
# toward using gpu02's 512 GB RAM. Stock PR #266 head image, UD-IQ1_S .rad. Rows run in this order (expected value first);
# 30-tune512.sh skips a row whose estimate no longer fits BUDGET_MIN and stops on runs/sweep.stop.
# Line format = sweep-exl3.sh's TAG|ENV|PHASES|EXTRA2 plus two fields for 40-best's choice: GROUP|SCORE
#   ENV     variables over the base: HOSTPOOL NGRAM CKINT MNBT NST MAXSEQS MML (serve_args in lib-pr266.sh)
#   PHASES  probe c4 c8 pf turns (mb.py / stepprobe.py as the 3.11. sweeps)
#   EXTRA2  flags appended to the line
#   SCORE   what decides the group for 40-best: c4 / c8 (agg_dec_tps), pf (prefill_tps), keep (pf decode_kept, prefill_tps
#           >= 0.6 x base), incl (taken unless c4 < 0.95 x base or the turns hit TTFT > 1.10 x base)
# --prefill-interleave auto is NOT in this head (Codeberg main only, a5830463/f87d03d3), so the interleave row is the 3.11. value 8.
# The pin rows need /stats/bakon.json from 20-bakon.sh (--expert-stats); without it they are skipped.
nst0|NST=0|probe,c4,c8||nst|c4
ngram-ram|NGRAM=ram|probe,c4,c8,pf||ng|c4
ramtier||probe,c4,c8,turns|--prefix-cache-mib 86016 --prefix-cache-ttl 28800 --checkpoint-slots 512 --checkpoint-policy keep-all|rt|incl
il8||probe,c4,c8,pf|--prefill-interleave 8|il|keep
ck2048|CKINT=2048|probe,c4,c8,pf||ck|pf
#k4096|CKINT=4096|probe,c4,c8,pf||ck|pf
ck16384|CKINT=16384 MNBT=16384|probe,c4,c8,pf||ck|pf
ms8|MAXSEQS=8|probe,c4,c8||ms|c8
ms4|MAXSEQS=4|probe,c4,c8||ms|c8
pin3||probe,c4,c8|--expert-profile /stats/bakon.json --expert-pin-top 0.3|pin|c4
#in5||probe,c4,c8|--expert-profile /stats/bakon.json --expert-pin-top 0.5|pin|c4
