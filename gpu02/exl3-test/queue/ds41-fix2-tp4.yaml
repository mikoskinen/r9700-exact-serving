# ds41-fix2-tp4.yaml (6.11.2026) -- queue-r2 items 62-66: = ds41-fix-tp4.yaml plus the idx2b thresholds; the queue-fix items 50-53: = ds41-117-tp4.yaml (MODELDIR mount, the serve line in ARGS,
# project/container radiance-ds41-exl3, the profiling environment) plus the two A/B switches of the fix images, passed
# through only when set in the shell (list syntax without a value: unset in the shell = unset in the container):
#   RADIANCE_DS41_INDEX   deepseek41 indexer: keep,split (default when unset) | keep | split | off
#   RADIANCE_EXL3_SPLITK  EXL3 EP split-K rules E1/E2: 1/on = on; unset = off (the default)
#   RADIANCE_DS41_KEEP_MIN_LIVE, RADIANCE_DS41_SPLIT_MIN_LIVE  (idx2b and later) the restriction / split thresholds, positions
#   RADIANCE_DS41_IDXKEY  (mx4 and later) mxfp4 = packed index keys; unset = bf16
#   RADIANCE_DS41_CTAIL   (ctail and later) full = the compressor tail chain over the whole work plane (before 6.11.)
#   R4D_DS41_QLDS         (qlds and later) 0 = the decode index_score reads q by scalar loads (before); unset = q in LDS
#   RADIANCE_EXL3_FUSE1   (fz1 exl3r4d and later) 0 = gate_up's prep and GEMM as two dispatches (before); unset = one launch
#   RADIANCE_DS41_ROUTER_FUSE (rsc and later) 0 = router_scored_topk + moe_scatter (before); unset = one launch
#   R4D_DS41_MIX_FUSE     (rsc and later) 0 = mhc_mix as split + finish kernels (before); unset = one launch
#   RADIANCE_DEBUG_TAPE_DUMP (core-dbg c85088e7 binaries) 1 = TAPEDUMP lines: every recorded pass's dispatches with read/write ranges
#   RADIANCE_AQL_ACQ      (core-dbg binaries, EXPERIMENT ONLY) none = played packets' agent-scope acquire dropped; (core-acq and
#                         later) rule | rule-w = only where haz_mark's address rule says no read line can be stale; unset = as before
#   RADIANCE_DS41_AR_PCN  (arpcn and later) 1 = the attention all-reduce + mhc_post_collapse_rmsnorm as one collective; (pcnm and later)
#                         2 = that and the MoE all-reduce + the next collapse-norm; unset = the pairs
#   RADIANCE_DS41_LATENT  (mx4l and later) nvfp4 = packed compressed latent; unset = bf16
name: radiance-ds41-exl3
services:
  radiance:
    extends: { file: /home/mikoskinen/radiance-1.15.1/compose/common.yaml, service: radiance }
    image: ${IMAGE:?set IMAGE}
    container_name: radiance-ds41-exl3
    restart: "no"
    volumes:
      - ${MODELDIR:?set MODELDIR}:/models:ro
      - ${STATSDIR:?set STATSDIR}:/stats
    environment:
      RADIANCE_PROFILE_EVERY: ${PROFEVERY:-}
      RADIANCE_PROFILE_SYNC: ${PROFSYNC:-}
      RADIANCE_AQL_STAMP: ${AQLSTAMP:-}
      RADIANCE_AQL_STAMP_OUT: /stats/stamps.csv
      RADIANCE_DS41_INDEX:
      RADIANCE_EXL3_SPLITK:
      RADIANCE_DS41_KEEP_MIN_LIVE:
      RADIANCE_DS41_SPLIT_MIN_LIVE:
      RADIANCE_DS41_IDXKEY:
      RADIANCE_DS41_CTAIL:
      R4D_DS41_QLDS:
      RADIANCE_EXL3_FUSE1:
      RADIANCE_DS41_ROUTER_FUSE:
      R4D_DS41_MIX_FUSE:
      RADIANCE_DEBUG_TAPE_DUMP:
      RADIANCE_AQL_ACQ:
      RADIANCE_DS41_AR_PCN:
      RADIANCE_DS41_LATENT:
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
    command: >
      --model /models/${MODEL:?set MODEL} --served-model-name deepseek-v4.1-flash --host 127.0.0.1 --port 8090
      ${ARGS:?set ARGS}
