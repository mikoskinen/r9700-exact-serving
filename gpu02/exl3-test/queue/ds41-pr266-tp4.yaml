# ds41-pr266-tp4.yaml (6.11.2026) -- DeepSeek-V4.1-Flash-1017 on gpu02 TP4 for the queue items 20/30/40 (stock PR #266 head
# image). = ~/gpu/ds41/exl3-test/ds41-exl3-tp4.yaml with the model directory a variable (MODELDIR -> /models; the UD-IQ1_S .rad
# is in ~/models/ds41, which the kit's file does not mount) and the whole serve line in ARGS (bakon's line passes no
# --max-num-seqs / --max-model-len). Same project and container name (radiance-ds41-exl3) as the kit's file, so its watchdog and
# window.sh down stop this server too. STATSDIR -> /stats (writable) for --expert-stats / --expert-profile.
# NOT production: port 8090, 127.0.0.1, no key (bench tools run on gpu02). Run from the compose project dir so .env is read:
#   IMAGE=... MODEL=... MODELDIR=... STATSDIR=... ARGS='...' docker compose --project-directory ~/radiance-1.15.1/compose -f ds41-pr266-tp4.yaml up -d
name: radiance-ds41-exl3
services:
  radiance:
    extends: { file: /home/mikoskinen/radiance-1.15.1/compose/common.yaml, service: radiance }
    image: ${IMAGE:?set IMAGE}
    container_name: radiance-ds41-exl3
    restart: "no"
    volumes:
      - ${MODELDIR:?set MODELDIR}:/models:ro
      - ${STATSDIR:?set STATSDIR}:/stats
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
    command: >
      --model /models/${MODEL:?set MODEL} --served-model-name deepseek-v4.1-flash --host 127.0.0.1 --port 8090
      ${ARGS:?set ARGS}
