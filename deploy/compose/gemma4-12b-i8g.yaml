# Gemma 4 12B-it at int8 on one card: every trunk linear int8 at i8a8 (activation scale per row and
# 128 columns), Google's assistant head merged in as the MTP drafter (depth 3), the image and audio
# embedders at bf16. bf16 KV: fp8 KV costs the 12B more than it saves. Thinking is off, as in Google's
# template; switch it per request (chat_template_kwargs). Sampling as the checkpoint's generation_config
# states it (temperature 1.0, top_p 0.95, top_k 64).
name: radiance-gemma4-12b-i8g
services:
  radiance:
    extends: { file: common.yaml, service: radiance }
    container_name: radiance-gemma4-12b-i8g
    command: >
      --model /models/gemma4-12b-i8g.rad
      --host :: --port ${PORT:-8000} --api-key-env RADIANCE_API_KEY
      --tp 1 --max-num-seqs 8 --max-model-len 65536 --kv-cache-dtype bf16
      --num-speculative-tokens 3 --max-num-batched-tokens 2048 --mm-max-patches 1120
      --temp 1.0 --top-p 0.95 --top-k 64 --chat-template-kwargs '{"enable_thinking":false}'
